# Golden path: the embedded v1 launches, a sync downloads the release and the next start runs it.
# By hand, release v2 first, then run
# `maestro test -e EXPECTED_VERSION=v2 -e EXPECTED_RELEASE_NUMBER=1 maestro/golden-path.yaml`.
appId: com.hotcodepush.demo.expo
---
- launchApp:
    clearState: true
    permissions:
      notifications: allow
- assertVisible: 'v1'
- assertVisible: 'embedded'
- tapOn: 'Sync now'
- extendedWaitUntil:
    notVisible: 'syncing…'
    timeout: 60000
# A fresh emulator can be offline for its first seconds, so the sync is retried.
- repeat:
    times: 3
    while:
      visible: 'failed · device_offline.*'
    commands:
      - tapOn: 'Sync now'
      - extendedWaitUntil:
          notVisible: 'syncing…'
          timeout: 60000
# The sync at start may have downloaded the release already.
# Either way it applies on the next start.
- assertVisible: 'downloaded · #${EXPECTED_RELEASE_NUMBER} · ${EXPECTED_VERSION}, applies next_start'
- stopApp
- launchApp:
    permissions:
      notifications: allow
- extendedWaitUntil:
    visible: ${EXPECTED_VERSION}
    timeout: 60000
- assertVisible: '#${EXPECTED_RELEASE_NUMBER} · ${EXPECTED_VERSION}'
