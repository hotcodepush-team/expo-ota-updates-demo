# The next release registers no root, so the process ends.
# The next start rolls back with `app_crashed`.
# A rollback at the readiness gate, `readiness_timed_out`, is also accepted.
# Continues from signed.yaml. By hand, release a build whose index.ts registers no root, then run
# `maestro test -e BROKEN_RELEASE_NUMBER=2 -e BROKEN_VERSION=v3 -e EXPECTED_RELEASE_NUMBER=1 -e EXPECTED_VERSION=v2 maestro/rollback-without-root.yaml`.
appId: com.hotcodepush.demo.expo
---
- launchApp:
    permissions:
      notifications: allow
- assertVisible: '#${EXPECTED_RELEASE_NUMBER} · ${EXPECTED_VERSION}'
- tapOn: 'Sync now'
- extendedWaitUntil:
    notVisible: 'syncing…'
    timeout: 60000
- repeat:
    times: 3
    while:
      visible: 'failed · device_offline.*'
    commands:
      - tapOn: 'Sync now'
      - extendedWaitUntil:
          notVisible: 'syncing…'
          timeout: 60000
# The tap or the check at start downloaded it, and `next_start` applies it.
- assertVisible: 'downloaded · #${BROKEN_RELEASE_NUMBER} · ${BROKEN_VERSION}, applies next_start'
- stopApp
- launchApp:
    permissions:
      notifications: allow
# On iOS Maestro fails the flow when a screen read meets the end of the process.
# The abort comes about a second after start, and ten seconds leave room for a slow simulator.
- evalScript: ${const until = Date.now() + 10000; while (Date.now() < until);}
# A launch without a stop restarts an ended app and leaves a running one alone.
# A stop would end a running app, and its next start would not report the rollback.
- repeat:
    times: 3
    while:
      notVisible: 'from #${BROKEN_RELEASE_NUMBER} · ${BROKEN_VERSION} · (readiness_timed_out|app_crashed)'
    commands:
      - extendedWaitUntil:
          visible: 'from #${BROKEN_RELEASE_NUMBER} · ${BROKEN_VERSION} · (readiness_timed_out|app_crashed)'
          timeout: 30000
          optional: true
      - launchApp:
          permissions:
            notifications: allow
          stopApp: false
- assertVisible: 'from #${BROKEN_RELEASE_NUMBER} · ${BROKEN_VERSION} · (readiness_timed_out|app_crashed)'
# The failed bundle is blocklisted on this device: the next check skips it.
- assertVisible: '#${EXPECTED_RELEASE_NUMBER} · ${EXPECTED_VERSION}'
- tapOn: 'Sync now'
- extendedWaitUntil:
    notVisible: 'syncing…'
    timeout: 60000
- assertVisible: 'skipped · bundle_failed_before'
