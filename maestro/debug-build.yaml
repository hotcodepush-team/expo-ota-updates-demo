# The debug build loads its JavaScript from the development server.
# A sync therefore skips with `build_debug`.
# The runner opens the app on the server URL plus `?disableOnboarding=1`.
# This hides the first-run sheet of the developer menu.
# By hand, run `npm run ios` or `npm run android`, dismiss that sheet once, then run
# `maestro test maestro/debug-build.yaml`.
appId: com.hotcodepush.demo.expo
---
# The first start waits for the development server to bundle the JavaScript.
- extendedWaitUntil:
    visible: 'Sync now'
    timeout: 120000
- assertVisible: 'embedded'
- tapOn: 'Sync now'
- extendedWaitUntil:
    notVisible: 'syncing…'
    timeout: 60000
- assertVisible: 'skipped · build_debug'
