# The build trusts a public key, and the newest release is unsigned or signed with another key.
# The SDK refuses it with `signature_invalid`, and the app stays on its embedded bundle.
# By hand, add a key to `publicKeys` in `hotcodepush.json`, rebuild, release unsigned, then run
# `maestro test maestro/invalid-signature.yaml`.
appId: com.hotcodepush.demo.expo
---
- launchApp:
    permissions:
      notifications: allow
- tapOn: 'Sync now'
- extendedWaitUntil:
    notVisible: 'syncing…'
    timeout: 60000
- repeat:
    times: 3
    while:
      visible: 'failed · device_offline.*'
    commands:
      - tapOn: 'Sync now'
      - extendedWaitUntil:
          notVisible: 'syncing…'
          timeout: 60000
- assertVisible: 'failed · signature_invalid.*'
- assertVisible: 'embedded'
