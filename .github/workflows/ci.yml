name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  JAVA_VERSION: 21

# Release builds of the native projects prebuild generates with the plugin, on every Expo SDK the package supports: a
# release build bundles the JavaScript and runs the build step, which writes hotcodepush.json into the app, so each job
# fails when the app lacks the file, when the file names no embedded bundle, or when a file of that bundle is not in the
# app as its manifest records it. SDK 55 is the demo's own, built from the lockfile; every other SDK first moves the
# project to that SDK's latest patch. HOTCODEPUSH_OFFLINE keeps the build step from asking the API, so no credential is
# needed. The device test, on the demo's own SDK, is the monorepo's.
jobs:
  javascript:
    name: Check the JavaScript
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
  android:
    name: Build the Android release app on Expo SDK ${{ matrix.sdk }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        sdk: [55, 56, 57]
    env:
      HOTCODEPUSH_OFFLINE: '1'
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: npm
      - uses: actions/setup-java@v5
        with:
          distribution: zulu
          java-version: ${{ env.JAVA_VERSION }}
      - uses: gradle/actions/setup-gradle@0723195856401067f7a2779048b490ace7a47d7c # v5.0.2
      - run: npm ci
      - if: matrix.sdk != 55
        run: |
          npm install expo@^${{ matrix.sdk }}.0.0
          npx expo install --fix
      - run: npx expo prebuild --platform android --no-install
      - run: ./gradlew assembleRelease --console=plain
        working-directory: android
      - run: |
          unzip -q android/app/build/outputs/apk/release/app-release.apk 'assets/*' -d apk
          node .github/scripts/check-embedded-bundle.mjs apk/assets
  ios:
    name: Build the iOS simulator release app on Expo SDK ${{ matrix.sdk }}
    runs-on: macos-latest
    strategy:
      fail-fast: false
      matrix:
        sdk: [55, 56, 57]
    env:
      HOTCODEPUSH_OFFLINE: '1'
    steps:
      - uses: actions/checkout@v7
      - uses: maxim-lobanov/setup-xcode@ed7a3b1fda3918c0306d1b724322adc0b8cc0a90 # v1.7.0
        with:
          xcode-version: latest-stable
      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - if: matrix.sdk != 55
        run: |
          npm install expo@^${{ matrix.sdk }}.0.0
          npx expo install --fix
      - run: npx expo prebuild --platform ios --no-install
      - run: pod install
        working-directory: ios
      - run: xcodebuild -workspace ios/HotCodePushDemo.xcworkspace -scheme HotCodePushDemo -configuration Release -destination 'generic/platform=iOS Simulator' -derivedDataPath ios/DerivedData CODE_SIGNING_ALLOWED=NO -quiet build 2>&1 | tee xcodebuild.log
        shell: bash
      - run: node .github/scripts/check-embedded-bundle.mjs ios/DerivedData/Build/Products/Release-iphonesimulator/HotCodePushDemo.app
      # The build step's phase is marked to run on every build, or Xcode warns that it declares no outputs. The search
      # names the phase: other phases' warnings and Xcode's notes on every phase so marked share the wording.
      - run: |
          ! grep "warning: Run script build phase 'Create HotCodePush binary' will be run during every build" xcodebuild.log
