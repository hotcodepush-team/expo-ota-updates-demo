name: Downloads

# A visitor installs one of these builds, and every later merge to main ships an update it takes.
# The builds run with the token, so the build step creates the binary and the app names its channel.
on:
  push:
    tags: ['binary/*']

permissions:
  contents: write

env:
  JAVA_VERSION: 21
  HOTCODEPUSH_TOKEN: ${{ secrets.HOTCODEPUSH_TOKEN }}

jobs:
  android:
    name: Build the Android release app
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: zulu
          java-version: ${{ env.JAVA_VERSION }}
      - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
      - run: npm ci
      - run: npx expo prebuild --platform android --no-install
      - run: ./gradlew assembleRelease --console=plain
        working-directory: android
      - run: mv android/app/build/outputs/apk/release/app-release.apk hotcodepush-demo-expo-android.apk
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: android
          path: hotcodepush-demo-expo-android.apk
  ios:
    name: Build the iOS simulator app
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: maxim-lobanov/setup-xcode@ed7a3b1fda3918c0306d1b724322adc0b8cc0a90 # v1.7.0
        with:
          xcode-version: latest-stable
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npx expo prebuild --platform ios --no-install
      - run: pod install
        working-directory: ios
      # An archive is the store build: its build step creates the binary, a plain build only writes the resource file.
      - run: xcodebuild archive -workspace ios/HotCodePushDemo.xcworkspace -scheme HotCodePushDemo -configuration Release -destination 'generic/platform=iOS Simulator' -archivePath ios/HotCodePushDemo.xcarchive CODE_SIGNING_ALLOWED=NO -quiet
      - run: ditto -c -k --keepParent ios/HotCodePushDemo.xcarchive/Products/Applications/HotCodePushDemo.app hotcodepush-demo-expo-ios-simulator.zip
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ios
          path: hotcodepush-demo-expo-ios-simulator.zip
  publish:
    name: Publish the GitHub release
    needs: [android, ios]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          merge-multiple: true
      - run: >
          gh release create "$GITHUB_REF_NAME"
          --title "Downloads $GITHUB_REF_NAME"
          --notes "The Android APK and the iOS simulator app of the Expo demo, built from this tag and pre-configured for the demo's app on production."
          hotcodepush-demo-expo-android.apk hotcodepush-demo-expo-ios-simulator.zip
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
